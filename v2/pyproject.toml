[project]
name = "sigi-modular"
version = "0.2.0a2"
description = "SIGI : modèle, outils et journal remplaçables"
requires-python = ">=3.11"
license = "MIT"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sigi*"]

[tool.setuptools.package-data]
sigi = ["static/*.html", "static/*.css", "static/*.js"]
